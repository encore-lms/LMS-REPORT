# GitHub Pages 배포 — Source 가 GitHub Actions 이므로 이 워크플로가 배포 주체다.
# 빌드 단계는 없다(정적 파일 그대로). 저장소 루트를 아티팩트로 올려 배포한다.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 진행 중인 것을 취소하지 않고 큐에 세워 유실을 막는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 발행 HTML 은 생성물이라 저장소에 두지 않는다(공동 작업 시 충돌 1순위였다).
      # 조각에서 여기서 조립한다.
      - name: 보고서 조립
        run: python3 build.py
      # 루트를 올리되 배포에 필요 없는 것은 뺀다.
      # path: . 로 두면 .git 전체가 아티팩트에 담겨 업로드가 커진다.
      - name: 배포본 준비
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='sections' --exclude='build.py' --exclude='.gitignore' \
            ./ _site/
          echo "--- 배포본 목록 ---" && ls -1 _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages 큐 처리가 10분을 넘는 날이 있다(2026-08-06 실측 — 기본 600초에서
          # 액션이 포기·취소했지만 서버에서는 배포가 완료됨). 느린 배포를 실패로
          # 뒤집고 그 취소가 다음 배포를 막는 잠금이 되므로, 30분까지 기다린다.
          timeout: 1800000
