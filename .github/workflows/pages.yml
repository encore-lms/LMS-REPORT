# GitHub Pages 배포 — Source 가 GitHub Actions 이므로 이 워크플로가 배포 주체다.
# 빌드 단계는 없다(정적 파일 그대로). 저장소 루트를 아티팩트로 올려 배포한다.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 진행 중인 것을 취소하지 않고 큐에 세워 유실을 막는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 루트를 그대로 올리되 배포에 불필요한 것은 뺀다.
      # path: . 로 두면 .git 전체가 아티팩트에 담겨 업로드가 커진다.
      - name: 배포본 준비
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' --exclude='.github' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
